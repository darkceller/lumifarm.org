baseURL = 'https://www.lumifarm.org/'
languageCode = 'zh-tw'
title = "光農合作社群"
buildFuture = true
theme = 'blowfish'

[params]
  defaultAppearance = "dark"
  disableThemeToggle = true
  logo = "logo.png"

  # 👇 1. 新增這行 Blowfish 真正認得的版權變數 (注意 { year } 會自動抓取今年年份！)
  copyright = "© { year } 光農合作社群 Luminous Farmer's Network。<br>除非另有說明，本網站上的所有原創素材（包含文字、圖片及視覺內容），其智慧財產權均屬光農合作社群所有。<br>部分內容依照創用 CC (Creative Commons) 授權條款分享，並已適當標註原創作者。<br>如需轉載或散佈本站原創內容，請[與我們聯絡](/about)。"

# 👇 2. 修正頁尾設定
  [params.footer]
    showCopyright = true          # 👉 必須改為 true，把頁尾喚醒！
    showThemeAttribution = false  # 👉 保持 false，這會完美隱藏原廠的 Powered by 廣告
    # (把原本的 customText 整行刪除，保持檔案乾淨)

  [params.header]
    showLogo = true
    logo = "logo.png"

  [params.homepage]
    showRecent = false
    layout = "background"
    homepageImage = "images/food-forest-bg.png"
    # 背景遮罩：讓背景變暗，文字更顯眼
    imageFilter = "brightness(0.4) contrast(1.1)"

  [params.article]
    showDate = false         # 👉 改成 false
    showReadingTime = false  # 👉 改成 false
    showWordCount = false    # 👉 新增這行，強制隱藏字數
    showAuthor = false
    layout = "card"

  # 👇 新增這個區塊，確保其他獨立頁面也不會跑出日期
  [params.page]
    showDate = false
    showReadingTime = false
    showWordCount = false
    showAuthor = false

# ==========================================
# 頂部導覽列選單設定
# ==========================================
[menu]
  [[menu.main]]
    name = "關於我們"
    pageRef = "/about"
    weight = 10

  [[menu.main]]
    name = "光農快訊"
    url = "/news/"    # 👉 換成 url，並加上斜線
    weight = 15

  [[menu.main]]
    name = "光農碳積分"
    pageRef = "/community"
    weight = 20

  [[menu.main]]
    name = "志工招募"
    pageRef = "/volunteer"
    weight = 25

  [[menu.main]]
    name = "活動紀實"
    pageRef = "/records/"
    weight = 28

  [[menu.main]]
    name = "永續知識"
    pageRef = "/posts"
    weight = 30

  [[menu.main]]
    name = "支持我們"
    pageRef = "/support"
    weight = 40

# ==========================================
# 核心功能設定 (必須獨立出來，不能縮進到選單內)
# ==========================================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true