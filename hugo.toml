baseURL = 'https://www.lumifarm.org/'
languageCode = 'zh-tw'
title = "光農合作社群 Lumiuous Farmer's Network"
buildFuture = true
theme = 'blowfish'

[params]
  customCSS = ["css/custom.css"]
  
  [params.header]
    showLogo = true
    logo = "images/logo.png"

  [params.homepage]
    showRecent = false
    layout = "background"
    homepageImage = "images/food-forest-bg.png"
    # 這裡可以嘗試增加一個半透明的遮罩，讓背景變暗，文字更顯眼
    imageFilter = "brightness(0.4) contrast(1.1)"

  [params.article]
    showDate = true
   showReadingTime = true
    showAuthor = false
    # 開啟卡片模式
    layout = "card"
# ==========================================
# 頂部導覽列選單設定 (weight 代表排序，數字越小越前面)
# ==========================================

[menu]
  [[menu.main]]
    name = "關於我們"
    pageRef = "/about"
    weight = 10
  [[menu.main]]
    name = "永續農耕知識庫"
    pageRef = "/posts"
    weight = 20
  [[menu.main]]
    name = "參與行動"
    url = "/#最新動態與參與行動"
    weight = 30
  [[menu.main]]
    name = "支持我們"
    pageRef = "/support"
    weight = 40

    [markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true