baseURL = 'https://www.lumifarm.org/'
languageCode = 'zh-tw'
title = "光農合作社群"
buildFuture = true
theme = 'blowfish'

[params]
  defaultAppearance = "dark"
  disableThemeToggle = true
  logo = "logo.png"

# 👇 2. 修正頁尾設定
[params.footer]
    showCopyright = true
    showThemeAttribution = false
    # 👇 替換成這段：結尾加上了管理員專屬的捷徑
    customText = "© { year } 光農合作社群 Luminous Farmer's Network。<br>除非另有說明，本網站上的所有原創素材（包含文字、圖片及視覺內容），其智慧財產權均屬光農合作社群所有。<br>部分內容依照創用 CC (Creative Commons) 授權條款分享，並已適當標註原創作者。<br>如需轉載或散佈本站原創內容，請<a href='/about' style='color: #4ade80; text-decoration: underline;'>與我們聯絡</a>。<br><br><a href='/admin' style='color: rgba(255,255,255,0.2); font-size: 0.8rem; text-decoration: none;' onmouseover=\"this.style.color='#4ade80'\" onmouseout=\"this.style.color='rgba(255,255,255,0.2)'\">⚙️ 管理員登入</a>"

  [params.header]
    showLogo = true
    logo = "logo.png"
    logoText = "光農合作社群"  # 👉 新增這行：強制導覽列只顯示簡短中文，就不會擠成一團了！

  [params.homepage]
    showRecent = false
    layout = "background"
    homepageImage = "images/food-forest-bg.png"
    # 背景遮罩：讓背景變暗，文字更顯眼
    imageFilter = "brightness(0.4) contrast(1.1)"

  [params.article]
    showDate = true          # 👉 建議把日期打開，這樣「活動紀實」才有時間感
    showReadingTime = false
    showWordCount = false
    showAuthor = false
    layout = "classic"       # 👉 關鍵修復：改成 classic，標題就不會像首頁一樣無限放大了！

  # 👇 新增這個區塊：強制「活動紀實」等目錄頁面使用卡片排版
  [params.list]
    layout = "card"

  # 👇 新增這個區塊，確保其他獨立頁面也不會跑出日期
  [params.page]
    showDate = false
    showReadingTime = false
    showWordCount = false
    showAuthor = false

# ==========================================
# 頂部導覽列選單設定
# ==========================================
[menu]
  [[menu.main]]
    name = "關於我們"
    pageRef = "/about"
    weight = 10

  [[menu.main]]
    name = "光農快訊"
    url = "/news/"    # 👉 換成 url，並加上斜線
    weight = 15

  [[menu.main]]
    name = "光農碳積分"
    pageRef = "/community"
    weight = 20

  [[menu.main]]
    name = "志工招募"
    pageRef = "/volunteer"
    weight = 25

  [[menu.main]]
    name = "活動紀實"
    pageRef = "/records/"
    weight = 28

  [[menu.main]]
    name = "永續知識"
    pageRef = "/posts"
    weight = 30

  [[menu.main]]
    name = "支持我們"
    pageRef = "/support"
    weight = 40

# ==========================================
# 核心功能設定 (必須獨立出來，不能縮進到選單內)
# ==========================================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true