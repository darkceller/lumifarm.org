baseURL = 'https://www.lumifarm.org/'
languageCode = 'zh-tw'
title = "光農合作社群 Luminous Farmer's Network"
buildFuture = true
theme = 'blowfish'

[params]
  customCSS = ["css/custom.css"]
  logo = "logo.png"
  
  [params.header]
    showLogo = true
    logo = "logo.png"

  [params.homepage]
    showRecent = false
    layout = "background"
    homepageImage = "images/food-forest-bg.png"
    # 背景遮罩：讓背景變暗，文字更顯眼
    imageFilter = "brightness(0.4) contrast(1.1)"

  [params.article]
    showDate = true
    showReadingTime = true
    showAuthor = false
    # 開啟卡片模式
    layout = "card"

# ==========================================
# 頂部導覽列選單設定
# ==========================================
[menu]
  [[menu.main]]
    name = "關於我們"
    pageRef = "/about"
    weight = 10

  [[menu.main]]
    name = "光農快訊"
    url = "/news/"    # 👉 換成 url，並加上斜線
    weight = 15

  [[menu.main]]
    name = "光農碳積分"
    pageRef = "/community"
    weight = 20

  [[menu.main]]
    name = "志工招募"
    pageRef = "/volunteer"
    weight = 25

  [[menu.main]]
    name = "永續知識"
    pageRef = "/posts"
    weight = 30

  [[menu.main]]
    name = "支持我們"
    pageRef = "/support"
    weight = 40

# ==========================================
# 核心功能設定 (必須獨立出來，不能縮進到選單內)
# ==========================================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true