<script>

const events = [
    
    {
        title: "樸爪農園志工日",
        date: "2026-04-18",
        displayDate: "2026.04.18",
        link: "https:\/\/www.google.com\/"
    },
    
];


const monthYear = document.getElementById('monthYear');
const calendarDays = document.getElementById('calendarDays');
const eventList = document.getElementById('event-list');
let date = new Date();

function renderCalendar() {
    date.setDate(1);
    const month = date.getMonth();
    const year = date.getFullYear();
    const firstDayIndex = date.getDay();
    const lastDay = new Date(year, month + 1, 0).getDate();
    const prevLastDay = new Date(year, month, 0).getDate();
    const nextDays = 7 - new Date(year, month + 1, 0).getDay() - 1;

    monthYear.innerHTML = `${year}年 ${month + 1}月`;
    let days = "";

    
    for (let x = firstDayIndex; x > 0; x--) {
        days += `<div class="day-muted">${prevLastDay - x + 1}</div>`;
    }

    
    for (let i = 1; i <= lastDay; i++) {
        let currentDayStr = `${year}-${String(month+1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
        let hasEvent = events.some(e => e.date === currentDayStr);
        
        if (hasEvent) {
            days += `<div><div class="day-active" onclick="renderEvents('${currentDayStr}')">${i}</div></div>`;
        } else {
            days += `<div><div class="day-normal" onclick="renderEvents('${currentDayStr}')">${i}</div></div>`;
        }
    }

    
    for (let j = 1; j <= nextDays; j++) {
        days += `<div class="day-muted">${j}</div>`;
    }
    calendarDays.innerHTML = days;
    renderEvents(null); 
}

function renderEvents(filterDate) {
    let html = '';
    let filteredEvents = events;
    
    if (filterDate) {
        filteredEvents = events.filter(e => e.date === filterDate);
    } else {
        const monthStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2, '0')}`;
        filteredEvents = events.filter(e => e.date.startsWith(monthStr));
    }

    if (filteredEvents.length === 0) {
        html = '<p style="opacity: 0.5; padding: 1rem 0;">這一天（或這個月）目前沒有安排活動喔！</p>';
    } else {
        filteredEvents.forEach(e => {
            html += `
            <a href="${e.link}" target="_blank" class="event-card">
                <div class="event-icon">
                    <svg style="width:24px; height:24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <div>
                    <div style="font-size:0.85rem; opacity:0.6; margin-bottom:4px;">${e.displayDate}</div>
                    <h3 style="font-size:1.2rem; font-weight:bold; margin:0;">${e.title}</h3>
                </div>
            </a>`;
        });
    }
    eventList.innerHTML = html;
}

document.getElementById('prevBtn').addEventListener('click', () => { date.setMonth(date.getMonth() - 1); renderCalendar(); });
document.getElementById('nextBtn').addEventListener('click', () => { date.setMonth(date.getMonth() + 1); renderCalendar(); });

renderCalendar();
</script>
